name: Katkı yılanı

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Renkler README ile aynı: siyah zemin, kırmızı yılan, kırmızıya giden noktalar.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23bb0000&color_dots=%23111111,%233a0000,%237a0000,%23bb0000,%23ff3b3b
            dist/snake-light.svg?color_snake=%23bb0000&color_dots=%23ebedf0,%23f5c2c2,%23e08585,%23c93a3a,%23bb0000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
